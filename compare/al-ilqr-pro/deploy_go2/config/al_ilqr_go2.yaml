# AL-iLQR Go2 Configuration
# 用于 Go2 四足机器人 + Odin 传感器的局部轨迹优化器参数
# 参数名参照 ros_wrapper/config/al_ilqr_params.yaml，保留原结构命名

# --- 车辆/机器人参数 ---
vehicle:
  wheelbase: 0.4            # 虚拟轴距（需现场标定，见 DEPLOY.md）
  max_speed: 0.8            # 最大线速度 m/s（保守值）
  min_speed: -0.3           # 最小线速度 m/s（后退）
  max_acceleration: 1.0     # 最大加速度 m/s^2
  min_acceleration: -1.5    # 最大减速度 m/s^2
  max_steering: 0.5         # 等效最大转向角 rad
  min_steering: -0.5        # 等效最小转向角 rad
  length: 0.6               # 机器人外形长度 m
  width: 0.4                # 机器人外形宽度 m
  rear_axle_to_rear: 0.15   # 后轴到尾部距离 m
  collision_circle_count: 1 # 碰撞检测圆数

# --- 求解器参数 ---
solver:
  horizon: 20               # 预测步数（horizon * dt = 2.0s 预测窗口）
  dt: 0.1                   # 时间步长 s
  max_outer_iterations: 6   # AL 外层最大迭代（07-30 真机：4 会间歇性不收敛，6 后 100% 收敛）
  max_inner_iterations: 30  # iLQR 内层最大迭代（07-30 真机：12 不够，30 后稳定；解析求导下耗时仍仅 2-3ms）
  initial_penalty: 20.0     # AL 初始惩罚系数
  penalty_scaling: 5.0      # AL 惩罚放大倍率
  constraint_tolerance: 0.1 # 约束容差
  convergence_threshold: 1.0e-3      # 内层 iLQR 代价收敛阈值
  # 求导模式：analytical（解析，闭式 Jacobian/Hessian）
  #           numerical（中心差分，仅用于对照验证）
  # 解析模式避开了每步 100+ 次代价函数差分（每次还要遍历所有 AL 约束），
  # NX 上实测从 ~124ms 降到 10ms 量级。本参数由 ros_node loadParameters() 读取
  # 并传入 GuidanceTrackerConfig::use_analytical_derivatives。
  derivative_mode: "analytical"

# --- 代价权重 ---
weights:
  position_weight: 10.0           # 位置跟踪权重
  heading_weight: 5.0             # 朝向跟踪权重
  speed_weight: 2.0               # 速度跟踪权重
  accel_reg_weight: 1.0           # 加速度惩罚
  steering_reg_weight: 1.0        # 转向惩罚
  terminal_position_weight: 50.0  # 终端位置权重
  terminal_heading_weight: 20.0   # 终端朝向权重
  terminal_speed_weight: 2.0      # 终端速度权重

# --- 规划参数 ---
planning:
  rate: 10.0               # 规划循环频率 Hz
  ref_speed: 0.8           # 参考速度 m/s（自动限幅到 vehicle/max_speed）
  guidance_lookahead: 25   # 全局路径前视步数（必须 >= solver/horizon，否则自动抬高）
  odom_timeout: 0.5        # 里程计数据最大年龄 s，超时则停车并报 ODOM_TIMEOUT（<=0 禁用）
  # 停滞恢复：求解收敛但 |cmd_v| < stall_cmd_threshold 且未接近路径末端，
  # 连续 stall_recovery_cycles 个周期后清空 warm start，回退 Pure-Pursuit
  # 初值（含前向加速度），跳出“静止=零违约”局部最优
  #（07-30 真机现象：cvg=1、viol=0、a≈-0.001、机器人不走）。
  stall_cmd_threshold: 0.05     # 停滞判定速度阈值 m/s（<=0 禁用）
  stall_recovery_cycles: 3      # 连续停滞周期数阈值
  # 道路边界约束开关：当前为纯目标点跟随模式，默认禁用。
  # 该约束是绝对坐标系（odom）y 向走廊（基于沿 x 轴的固定参考线），
  # 并非真实车道线——机器人走出 y∈[road.lower_bound, road.upper_bound]
  # 范围会导致约束失败。后续如需车道/走廊限制，可设为 true 并
  # 调整 road.lower_bound / road.upper_bound。
  enable_road_boundary: false

# --- 道路边界 ---
road:
  lower_bound: -5.0        # 道路下界 m
  upper_bound: 5.0         # 道路上界 m

# --- 障碍物（动态避障，/scan 实时）---
# 数据源：pointcloud_to_laserscan 输出的 /scan（前向 90° FOV，
# 由 /odin1/cloud_slam 点云高度过滤 [-0.2, +0.4]m 相对传感器后生成）
# 所有障碍物参数统一在本段，与 C++ dynamic_obstacles/ 命名空间完全一致，
# 均由 loadParameters() 读取（旧的 obstacle: 段多数键从未被读取，已删除）
dynamic_obstacles:
  enable: true                      # 启用动态避障
  scan_topic: "/scan"               # pointcloud_to_laserscan 输出的前向 90° 激光
  inflate_radius: 0.3               # 障碍物膨胀/安全半径 m
  max_obstacles: 5                  # 最大考虑障碍数（按距机器人远近取前 N 个；
                                    #  07-30 真机：10 个墙壁簇 × 20 stage 约 200 条约束
                                    #  导致间歇性不收敛，降到 5 后 100% 收敛）
  cluster_tolerance: 0.3            # 聚类距离阈值 m
  max_range: 5.0                    # 激光最大有效距离 m
  min_radius: 0.05                  # 最小障碍半径（过滤噪声）m
  max_radius: 2.0                   # 最大障碍半径（过滤异常大簇兜底）m
  max_cluster_radius: 0.4           # 单簇最大外接圆半径（不含膨胀）m：
                                    #  跨度超过 2×此值的簇（典型如整段走廊墙）拆分为
                                    #  多个小圆。不拆分时墙壁外接圆（圆心在墙上、半径
                                    #  可达 2m+）会覆盖走廊中央，求解器认为任何前进都
                                    #  违约，收敛到“原地不动”零违约局部最优
                                    #（07-30 真机阻塞根因）。<=0 禁用拆分
  timeout: 1.0                      # 障碍物数据最大年龄 s：激光掉线后不再使用
                                    #  陈旧障碍约束（否则会被已不存在的障碍永久堵死），<=0 禁用

# --- 路径参数 ---
path:
  curvature_weight: 0.5    # 曲率权重
  min_speed: -0.3          # 路径速度下限 m/s
  max_speed: 0.8           # 路径速度上限 m/s

# --- 控制映射（自行车→差速）---
control_mapping:
  virtual_wheelbase: 0.4    # 虚拟轴距（关键标定项）
  max_linear_vel: 0.8       # 输出最大线速度 m/s
  max_angular_vel: 1.2      # 输出最大角速度 rad/s
  # 速度指令前视步数：cmd_vel 线速度取规划轨迹第 k 步速度 states[k](3)，
  # 而非增量式 "odom速度 + a*dt"。后者静止起步时每周期最多爬升
  # max_accel*dt ≈ 0.1 m/s（落在 Go2 底盘死区内），而机器人不动时
  # odom 速度恒为 0，形成自举死锁（07-30 真机阻塞根因之一）。
  # k=3 时起步指令 ≈ 0.3 m/s，可靠脱离死区。0 = 退化回旧行为。
  speed_lookahead_steps: 3

# --- ROS 话题（扁平结构，与 nh_.param() 读取方式一致）---
odom_topic: "/odin1/odometry"          # Odin 里程计
path_topic: "/initial_path"            # Odin map_planner 全局路径（通常在 map 系，
                                       #  节点会按 TF 自动变换到 odom_frame）
scan_topic: "/scan"                    # 激光雷达（监控 + 动态避障共用）
cmd_vel_topic: "/cmd_vel"              # 底盘控制
base_frame: "odin1_base_link"          # 机器人基坐标系
odom_frame: "odom"                     # 里程计坐标系（规划/控制工作坐标系）
# 注：optimized_path(/al_ilqr/optimized_path) 与 status(/al_ilqr/status)
#     在代码中硬编码发布，不可通过参数配置

# --- 到达判定 ---
# arrive_topic 必须与 Odin goal_state_machine 订阅的话题一致
#（/neupan/arrive，std_msgs/Empty），否则到达后自动重规划链路断裂
goal:
  position_tolerance: 0.3           # 到达目标位置容差 m
  heading_tolerance: 0.2            # 到达目标朝向容差 rad（仅 check_heading=true 时生效）
  check_heading: false              # 是否把朝向误差纳入到达判定（默认否：
                                    #  全局路径终点朝向由 map_planner 生成，
                                    #  强制对齐可能导致原地转圈）
  publish_arrive: true              # 是否发布到达事件
  arrive_topic: "/neupan/arrive"    # 到达事件话题（goal_state_machine 订阅）
