# ========================================
# LiDAR 内参配置 - lidar1
# ========================================
#
# 使用 Isaac Sim RTX LiDAR 内置配置

model: rtx_lidar

# RTX LiDAR 内置配置名称
# 可选值参考 Isaac Sim 内置配置:
#   旋转式:
#     Ouster: "OS1_REV7_128ch10hz1024res", "OS1_REV6_32ch10hz1024res", ...
#     HESAI:  "Hesai_XT32_SD10"
#     SICK:   "SICK_tim781", "SICK_multiScan136", ...
#     NVIDIA: "Example_Rotary"
#   固态 (无旋转畸变, 单帧全量点云):
#     ZVISION: "ZVISION_ML30S" (153°×73°, 51K pts, 45m)
#              "ZVISION_MLXS" (123°×32°, 108K pts, 250m)
#     NVIDIA:  "Simple_Example_Solid_State" (5°×16°, demo only)
# 低延迟配置 (51K 点/帧, 减少 RViz 传输延迟)
config_name: "lidar_configs/json/MLXS_nofire_quarter.json"
# 其他可用配置:
#   "Example_Rotary" — 130K+ pts/frame, 高清但延迟大
#   "ZVISION_MLXS"   — 108K pts/frame
#   自定义 JSON: 需先用 tools/convert_lidar_json.py 转为 .usd
