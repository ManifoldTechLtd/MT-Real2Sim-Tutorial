# ========================================
# 相机内参配置 - odin1 鱼眼相机
# ========================================
#
# FishPoly 鱼眼多项式模型
# 投影: r(θ) = θ + k2·θ² + k3·θ³ + k4·θ⁴ + k5·θ⁵ + k6·θ⁶ + k7·θ⁷
# 像素坐标: u = A11·r·cosφ + A12·r·sinφ + u0
#           v = A22·r·sinφ + v0
# 其中 θ = 入射角, φ = atan2(y, x) 方位角

# model: fishpoly   # 鱼眼模型 (ftheta API, 待后续调试)
model: pinhole      # 临时使用针孔模型进行后续测试
image_width: 1600
image_height: 1296

# 仿射内参
A11: 7.3735683773268692e+02    # ≈ fx
A12: -4.0977897450998052e-01   # skew (接近 0)
A22: 7.3729158717678535e+02    # ≈ fy
u0:  7.9437192080462398e+02    # cx
v0:  6.6625886729029014e+02    # cy

# FishPoly 畸变系数
k2: 5.0379242441551616e-05
k3: -7.4415257914767799e-03
k4: -4.1365539417288134e-02
k5: 5.5346546592564667e-02
k6: -3.3479736619860797e-02
k7: 5.9355751390599035e-03

# 切向畸变 (均为 0)
p1: 0.0
p2: 0.0

# 最大入射角 (度)
maxIncidentAngle: 120
