# nav_algo 参数

# Terrain Analysis
terrain_analysis:
  planar_voxel_size: 1.0
  ground_quantile: 0.05
  obstacle_height_thre: 0.2

# Local Planner
local_planner:
  path_length: 4.0
  n_paths: 21
  max_angle_deg: 30.0

# Path Follower
path_follower:
  lookahead_dist: 1.0
  max_v: 3.0
  max_w: 3.0
  goal_tolerance: 0.3
