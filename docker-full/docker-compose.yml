# 全容器化方案: Isaac Sim + ROS1 Noetic
# 用法:
#   xhost +local:docker
#   SCENE_DIR=~/dataset/isaac docker compose -f docker-full/docker-compose.yml up
#
# headless 模式:
#   SCENE_DIR=~/dataset/isaac docker compose -f docker-full/docker-compose.yml run \
#     isaac-sim python /workspace/r2s2r/run_sim.py --headless

services:
  isaac-sim:
    build:
      context: ..
      dockerfile: docker-full/Dockerfile.isaac
    image: r2s2r-isaac:5.1.0
    container_name: r2s2r_isaac
    user: root
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
    volumes:
      # 项目代码 (bind mount 覆盖镜像内副本, 方便开发)
      - ../r2s2r:/workspace/r2s2r:ro
      - ../lidar_configs:/workspace/lidar_configs:ro
      # 场景文件
      # 注意: YAML 不会展开 ~, 这里用 ${HOME}; 推荐通过 start.sh 启动以避免出错
      - ${SCENE_DIR:-${HOME}/dataset/isaac}:/scenes:ro
      # X11 GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
      # Isaac Sim cache (named volumes, 避免重复下载)
      - isaac-cache:/isaac-sim/.cache
      - isaac-computecache:/isaac-sim/.nv/ComputeCache
      - isaac-logs:/isaac-sim/.nvidia-omniverse/logs
      - isaac-config:/isaac-sim/.nvidia-omniverse/config
      - isaac-data:/isaac-sim/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ros1:
    build:
      context: ..
      dockerfile: docker-full/Dockerfile.ros1
    image: r2s2r-ros1:noetic
    container_name: r2s2r_ros1
    command: ["bash", "-c", "source /catkin_ws/devel/setup.bash && sleep infinity"]
    network_mode: host
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_MASTER_URI=http://localhost:11311
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - LIBGL_ALWAYS_INDIRECT=0
      - XAUTHORITY=/root/.Xauthority
    volumes:
      - ../ros1_ws/src:/catkin_ws/src
      - ../tools:/tools:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  isaac-cache:
  isaac-computecache:
  isaac-logs:
  isaac-config:
  isaac-data:
